version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: swims_postgres
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      POSTGRES_USER: swims
      POSTGRES_PASSWORD: swims_dev_password
      POSTGRES_DB: swims
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swims']
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: swims_pgbouncer
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      - DATABASE_URL=postgres://swims:swims_dev_password@postgres:5432/swims
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - ADMIN_USERS=postgres,swims
      - AUTH_TYPE=scram-sha-256
    ports:
      - '6432:6432'
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: swims_redis
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 64m
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: swims_minio
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      MINIO_ROOT_USER: swims_minio
      MINIO_ROOT_PASSWORD: swims_minio_password
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: swims_backend
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 384m
    # We mount the volumes to allow hot-reloading from host
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/node_modules
      - /app/shared/node_modules
    command: sh -c "npm run migrate && npm run dev:backend"
    ports:
      - '4000:4000'
    environment:
      - DATABASE_URL=postgresql://swims:swims_dev_password@pgbouncer:6432/swims
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change-me-to-a-64-char-random-string
      - JWT_REFRESH_SECRET=change-me-to-another-64-char-random-string
      - JWT_ACCESS_EXPIRY=8h
      - JWT_REFRESH_EXPIRY=7d
      - ENCRYPTION_KEY=a3f9b8c4d2e1f0a9b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=swims_minio
      - S3_SECRET_KEY=swims_minio_password
      - S3_BUCKET=swims-media
      - S3_REGION=us-east-1
      - PORT=4000
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - pgbouncer
      - redis
      - minio

  frontend:
    # Production build is baked into the image at build time (see ./Dockerfile).
    # No source bind-mount, so the baked .next is what actually runs.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swims_frontend
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 384m
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
      - BACKEND_INTERNAL_URL=http://backend:4000
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:
