version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: swims_postgres
    environment:
      POSTGRES_USER: swims
      POSTGRES_PASSWORD: swims_dev_password
      POSTGRES_DB: swims
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swims']
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: swims_pgbouncer
    environment:
      - DATABASE_URL=postgres://swims:swims_dev_password@postgres:5432/swims
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - ADMIN_USERS=postgres,swims
      - AUTH_TYPE=any
    ports:
      - '6432:6432'
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: swims_redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: swims_minio
    environment:
      MINIO_ROOT_USER: swims_minio
      MINIO_ROOT_PASSWORD: swims_minio_password
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
